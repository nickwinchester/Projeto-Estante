      <main>
        <h1>Biblioteca de livros de fantasia, romances, ficção e clássicos</h1>
        <p>
          Sou uma leitora apaixonada por histórias, mundos fantásticos e personagens
          que continuam vivendo na cabeça mesmo depois que a última página termina.
          Minha biblioteca reúne fantasia, dark fantasy, ficção, romances, clássicos
          e histórias que deixam uma marca. Gosto especialmente de livros que criam
          mundos próprios, daqueles em que é fácil esquecer por algumas horas que
          existe um mundo lá fora.
        </p>
        <p>
          Além de ler, gosto de viajar, conhecer culturas diferentes e descobrir
          novos lugares. Cada história também é uma forma de viajar. Este espaço
          nasceu para reunir minha biblioteca, registrar minhas leituras e
          compartilhar esse universo com quem acredita que uma boa história nunca
          termina exatamente quando fechamos o livro.
        </p>
